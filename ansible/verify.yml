---
- name: Verify deployment state (Read-only)
  hosts: vm
  become: true
  tasks:
    - name: Check if container is running
      community.docker.docker_container_info:
        name: "{{ app_container_name }}"
      register: container_info

    - name: Assert container is running
      ansible.builtin.assert:
        that:
          - container_info.exists
          - container_info.container.State.Running
        fail_msg: "Контейнер не запущен!"

    - name: Check HTTP health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_host_port }}/health"
        return_content: true
      register: health_check
      failed_when: health_check.status != 200 or health_check.json.status != 'ok'
